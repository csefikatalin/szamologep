<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számológép</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>

</head>

<body>
    <main>
        <header>
            <h1>Számológép</h1>
        </header>
        <section>
            <input type="text" id="kijelzo" value="" name="kijelzo" readonly>
        </section>
        <section>
            <p id="kifejezes">   </p>
        </section>
        <article>
            <button id="7" class="szam">7</button>
            <button id="8" class="szam">8</button>
            <button id="9" class="szam">9</button>
            <button class="muvelet">/</button>

            <button id="4" class="szam">4</button>
            <button id="5" class="szam">5</button>
            <button id="6" class="szam">6</button>
            <button class="muvelet">*</button>

            <button id="1" class="szam">1</button>
            <button id="2" class="szam">2</button>
            <button id="3" class="szam">3</button>
            <button class="muvelet">-</button>

            <button class="torles">C</button>
            <button id="0" class="szam">0</button>
            <button class="egyenlo">=</button>
            <button class="muvelet">+</button>
        </article>
    </main>
</body>

</html>
